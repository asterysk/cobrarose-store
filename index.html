<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Cobra Rose — UX mockup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #0a0a0a;
      color: #f0ece4;
      font-family: Georgia, "Times New Roman", serif;
    }

    .mockup-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      color: #d8d3c8;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      text-align: center;
      padding: 0.6rem 1rem;
      z-index: 10;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .wordmark {
      font-size: clamp(3rem, 10vw, 6.5rem);
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .tagline {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #9a958a;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="mockup-banner">UX MOCKUP — not a real store. Nothing on this site is for sale.</div>
  <main class="hero">
    <h1 class="wordmark">Cobra Rose</h1>
    <p class="tagline">Pipeline test — v0</p>
  </main>
</body>
</html>
